<h2>{{ 'admin.editUser' | translate }}</h2>

<div *ngIf="user">
    <app-user-form [user]="user" (submitted)="updateUser()" [error]="updateError"></app-user-form>
    
    <div style="margin-top: 20px; margin-bottom: 20px;">
        <button 
            mat-raised-button 
            color="accent" 
            (click)="sendPasswordReset()"
            [disabled]="isSendingPasswordReset || !user.email"
            [attr.aria-label]="'admin.sendPasswordReset' | translate">
            <mat-icon>mail</mat-icon>
            {{ (isSendingPasswordReset ? 'admin.sendPasswordResetInProgress' : 'admin.sendPasswordReset') | translate }}
        </button>
        <mat-hint *ngIf="!user.email" style="color: #999; margin-left: 10px;">
            {{ 'admin.emailRequired' | translate }}
        </mat-hint>
    </div>
</div>

<h2>{{ 'admin.queueEdition' | translate }}</h2>
<div *ngIf="error" class="error-message">{{ error }}</div>
<div class="table-container" role="table" aria-label="Destinations">
    <div class="flex-table" role="rowgroup">
        <div  class="flex-row">
            <h3>{{ 'admin.allowedQueues' | translate }}</h3>
            <mat-nav-list>
                <mat-list-item *ngFor="let allowedQueue of allowedQueues" (click)="selectQueueToRemove(allowedQueue)" >
                    <a matLine>{{ allowedQueue.name }}</a>
                    <input class="remove" [checked]="allowedQueue.checked" value="{{ allowedQueue.id }}" type="checkbox">
                </mat-list-item>
            </mat-nav-list>
        </div>
        <div class="flex-row small">
            <button mat-icon-button [disabled]="isRemovingQueues">
                <mat-icon style="color: indianred;" (click)="removeQueue()"> remove </mat-icon>
            </button>
            <button mat-icon-button (click)="addQueue()" [disabled]="isAddingQueues" >
                <mat-icon style="color:green;">add_box</mat-icon>
            </button>
        </div>
        <div class="flex-row">
            <h3>{{ 'admin.availableQueues' | translate }}</h3>
            <mat-nav-list >
                <mat-list-item *ngFor="let queueNotAllowed of queuesNotAllowed" (click)="selectQueueToAdd(queueNotAllowed)" >
                    <a matLine>{{ queueNotAllowed.name }}</a>
                    <input class="add" [checked]="queueNotAllowed.checked" value="{{ queueNotAllowed.id }}" type="checkbox">
                    
                </mat-list-item>
            </mat-nav-list>
        </div>
    </div>
</div>

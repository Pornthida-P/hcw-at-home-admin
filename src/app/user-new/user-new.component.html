<h2>{{ 'admin.createUser' | translate }}</h2>

<div style="background-color: #e3f2fd; padding: 15px; margin-bottom: 20px; border-left: 4px solid #2196F3; border-radius: 4px;">
    <div style="display: flex; align-items: start;">
        <mat-icon style="color: #2196F3; margin-right: 10px;">info</mat-icon>
        <div>
            <p style="margin: 0 0 10px 0; font-weight: 500;">{{ 'admin.activationLinkInfo' | translate }}</p>
            <p style="margin: 0; font-size: 0.9em; color: #616161;">{{ 'admin.activationLinkNote' | translate }}</p>
        </div>
    </div>
</div>

<app-user-form (submitted)="createUser($event)" [loading]="loading" [error]="error"></app-user-form>
